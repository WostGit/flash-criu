name: "10-turn CRIU (free GLM-5.3-Flash)"

on:
  workflow_dispatch:
    inputs:
      max_turns:
        description: "Turns to run and checkpoint"
        required: true
        default: "10"

env:
  AIHUBMIX_BASE_URL: "https://aihubmix.com/v1"
  AIHUBMIX_MODEL: "coding-glm-5.3-flash-free"
  CRIU_COMMIT: "2b7ac603cda31d015d91c856c34c557cb2300e7d"
  WORKDIR: ${{ github.workspace }}/work
  CKPT_ROOT: ${{ github.workspace }}/work/checkpoints
  LOG_ROOT: ${{ github.workspace }}/work/logs

jobs:
  ten-turn-criu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write

    steps:
      - name: Require AIHubMix secret
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.AIHUBMIX_API_KEY }}" ]; then
            echo "::error::Add repository secret AIHUBMIX_API_KEY"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker (runc runtime)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable" | \
            sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io
          sudo systemctl enable --now docker
          command -v runc
          runc --version

      - name: Build CRIU 4.3
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential pkg-config git \
            libprotobuf-dev libprotobuf-c-dev \
            protobuf-c-compiler protobuf-compiler \
            python3-protobuf \
            libnl-3-dev \
            libcap-dev \
            uuid-dev \
            libnet1-dev \
            libaio-dev \
            python3-yaml \
            libgnutls28-dev

          git clone https://github.com/checkpoint-restore/criu.git
          cd criu
          git checkout ${{ env.CRIU_COMMIT }}
          make -j"$(nproc)"
          sudo make install-criu
          sudo ldconfig
          sudo ln -sfn /usr/local/sbin/criu /usr/local/bin/criu
          sudo ln -sfn /usr/local/sbin/criu /usr/bin/criu
          criu --version

      - name: Workspace + Python
        run: |
          set -euo pipefail
          mkdir -p "${{ env.WORKDIR }}/scripts" "${{ env.CKPT_ROOT }}" "${{ env.LOG_ROOT }}"
          python3 -m venv "${{ env.WORKDIR }}/venv"
          source "${{ env.WORKDIR }}/venv/bin/activate"
          pip install --upgrade pip openai

      - name: Build probe
        run: |
          set -euo pipefail
          cat > "${{ env.WORKDIR }}/probe.c" << 'EOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdint.h>
          #include <string.h>
          #include <unistd.h>
          #include <signal.h>
          #include <fcntl.h>
          #include <sys/mman.h>
          #include <sys/time.h>
          #include <sys/random.h>

          /* One anonymous page. counter is the first 8 bytes, nonce the next 8.
             The rest stays zero so a masked hash of this page ignores the tick. */
          struct state_page {
              volatile uint64_t counter;
              unsigned char nonce[8];
              unsigned char pad[4096 - sizeof(uint64_t) - 8];
          };
          _Static_assert(sizeof(struct state_page) == 4096, "state page size");

          static struct state_page *st;
          static volatile sig_atomic_t snap;

          static void on_alrm(int sig) {
              (void)sig;
              st->counter++;
          }

          static void on_usr1(int sig) {
              (void)sig;
              snap = 1;
          }

          static void write_snapshot(void) {
              uint64_t c = st->counter;
              int fd = open("/tmp/probe_state", O_WRONLY | O_CREAT | O_TRUNC, 0644);
              if (fd >= 0) {
                  if (write(fd, st->nonce, 8) != 8) _exit(2);
                  if (write(fd, &c, sizeof(c)) != (ssize_t)sizeof(c)) _exit(2);
                  close(fd);
              }
              fprintf(stderr, "STAGE1_PROBE event=snapshot nonce=");
              for (int i = 0; i < 8; i++) fprintf(stderr, "%02x", st->nonce[i]);
              fprintf(stderr, " counter=%llu\n", (unsigned long long)c);
              fflush(stderr);
          }

          int main(void) {
              st = mmap(NULL, 4096, PROT_READ | PROT_WRITE,
                        MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
              if (st == MAP_FAILED) return 1;
              memset(st, 0, 4096);
              if (getrandom(st->nonce, 8, 0) != 8) return 1;

              struct sigaction sa;
              memset(&sa, 0, sizeof(sa));
              sa.sa_handler = on_alrm;
              sigaction(SIGALRM, &sa, NULL);
              sa.sa_handler = on_usr1;
              sigaction(SIGUSR1, &sa, NULL);

              struct itimerval it;
              it.it_interval.tv_sec = 0;
              it.it_interval.tv_usec = 100000;
              it.it_value = it.it_interval;
              setitimer(ITIMER_REAL, &it, NULL);

              fprintf(stderr, "TARGET_READY\n");
              fflush(stderr);
              int ready = open("/tmp/ready", O_WRONLY | O_CREAT | O_TRUNC, 0644);
              if (ready >= 0) {
                  if (write(ready, "ready\n", 6) != 6) _exit(2);
                  close(ready);
              }
              /* Drop Docker's log pipes so the dump does not depend on them. */
              int devnull = open("/dev/null", O_RDWR);
              if (devnull >= 0) {
                  dup2(devnull, 0);
                  dup2(devnull, 1);
                  dup2(devnull, 2);
                  if (devnull > 2) close(devnull);
              }
              for (;;) {
                  pause();
                  if (snap) {
                      snap = 0;
                      write_snapshot();
                  }
              }
          }
          EOF
          gcc -static -O2 -o "${{ env.WORKDIR }}/stage1-probe" "${{ env.WORKDIR }}/probe.c"

      - name: Helper scripts
        run: |
          set -euo pipefail
          cat > "${{ env.WORKDIR }}/scripts/start_target.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          docker rm -f egym-target >/dev/null 2>&1 || true
          docker create \
            --name egym-target \
            --runtime runc \
            --network none \
            --user 0 \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --entrypoint /stage1-probe \
            ubuntu:24.04
          docker cp "${WORKDIR}/stage1-probe" egym-target:/stage1-probe
          docker start egym-target
          for _ in $(seq 1 30); do
            if docker logs egym-target 2>&1 | grep -q TARGET_READY \
              || docker exec egym-target cat /tmp/ready >/dev/null 2>&1; then
              docker inspect -f '{{.State.Pid}}' egym-target > /tmp/target.pid
              echo "Target ready pid=$(cat /tmp/target.pid)"
              exit 0
            fi
            sleep 0.4
          done
          echo "Target failed to become ready"
          docker logs egym-target || true
          exit 1
          EOF

          cat > "${{ env.WORKDIR }}/scripts/checkpoint_turn.py" << 'EOF'
          #!/usr/bin/env python3
          """Checkpoint the live target, restore a copy, and compare memory.

          Pass requires:
            - restored nonce == dumped nonce
            - restored counter >= dumped counter
            - sha256 of the 4KiB state page, with the 8 counter bytes zeroed,
              is the same in the second dump as in the first
          The full pages-*.img sha256 is recorded and is not required to match:
          the counter (and the stack) change after restore.
          """
          import hashlib, json, os, subprocess, time
          from pathlib import Path

          turn = int(os.environ.get("TURN") or __import__("sys").argv[1])
          ckpt = Path(os.environ["CKPT_ROOT"]) / f"turn-{turn:02d}"
          ckpt.mkdir(parents=True, exist_ok=True)
          after = ckpt / "after"
          result = {
              "turn": turn,
              "checkpoint_ok": False,
          }

          def run(cmd, check=True):
              p = subprocess.run(cmd, capture_output=True, text=True)
              if check and p.returncode != 0:
                  raise RuntimeError(
                      "$ " + " ".join(cmd) + "\n" + (p.stdout or "") + (p.stderr or "")
                  )
              return p

          def chown(path):
              run(["sudo", "chown", "-R", f"{os.getuid()}:{os.getgid()}", str(path)])

          def snapshot(pid):
              run(["sudo", "kill", "-USR1", str(pid)])
              time.sleep(0.35)
              data = subprocess.check_output(
                  ["sudo", "nsenter", "-t", str(pid), "-m", "cat", "/tmp/probe_state"]
              )
              if len(data) < 16:
                  raise RuntimeError(f"short probe_state from pid {pid}: {data!r}")
              nonce = data[:8]
              counter = int.from_bytes(data[8:16], "little")
              return nonce, counter

          def proc_stats(pid):
              def text(path):
                  p = subprocess.run(["sudo", "cat", path], capture_output=True, text=True)
                  return p.stdout if p.returncode == 0 else ""

              status = text(f"/proc/{pid}/status")
              vals = {}
              for line in status.splitlines():
                  if ":" not in line:
                      continue
                  k, v = line.split(":", 1)
                  vals[k] = v.strip()

              def kb(key):
                  raw = vals.get(key, "").split()
                  return int(raw[0]) if raw and raw[0].isdigit() else None

              pss = None
              for line in text(f"/proc/{pid}/smaps_rollup").splitlines():
                  if line.startswith("Pss:"):
                      pss = int(line.split()[1])
              stat = text(f"/proc/{pid}/stat")
              starttime = None
              if ")" in stat:
                  fields = stat[stat.rfind(")") + 2 :].split()
                  if len(fields) >= 20:
                      starttime = int(fields[19])
              mem = None
              for line in text(f"/proc/{pid}/cgroup").splitlines():
                  path = line.split(":", 2)[-1]
                  raw = text("/sys/fs/cgroup" + path + "/memory.current").strip()
                  if raw.isdigit():
                      mem = int(raw)
                      break
              return {
                  "host_pid": int(pid),
                  "rss_kb": kb("VmRSS"),
                  "pss_kb": pss,
                  "vmhwm_kb": kb("VmHWM"),
                  "vmsize_kb": kb("VmSize"),
                  "cgroup_memory_current": mem,
                  "starttime": starttime,
              }

          def locate(cid):
              roots = ["/run/docker/runtime-runc/moby", "/var/run/docker/runtime-runc/moby"]
              found = run([
                  "bash", "-lc",
                  f"sudo find /run /var/run -path '*{cid}/state.json' 2>/dev/null || true",
              ], check=False)
              for state in (found.stdout or "").splitlines():
                  state = state.strip()
                  if not state:
                      continue
                  root = str(Path(state).parent.parent)
                  if root not in roots:
                      roots.append(root)
              errors = []
              for root in roots:
                  p = run(["sudo", "runc", "--root", root, "state", cid], check=False)
                  text = p.stdout or ""
                  i = text.find("{")
                  if p.returncode == 0 and i >= 0:
                      try:
                          info = json.loads(text[i:])
                      except json.JSONDecodeError as exc:
                          errors.append(f"{root}: {exc}")
                          continue
                      if "bundle" in info:
                          return root, info
                      errors.append(f"{root}: no bundle key in {list(info)[:8]}")
                  else:
                      tail = ((p.stderr or "") + text)[-400:]
                      errors.append(f"{root}: rc={p.returncode} {tail}")
              raise RuntimeError("could not locate runc bundle:\n" + "\n".join(errors))

          def log_tail(path, limit=80):
              lines = []
              try:
                  files = list(Path(path).rglob("*"))
              except OSError:
                  return ""
              for f in sorted(files):
                  try:
                      if not f.is_file() or f.stat().st_size > 2_000_000:
                          continue
                      if f.suffix not in {".log", ".txt"} and "log" not in f.name:
                          continue
                      if os.access(f, os.R_OK):
                          chunk = f.read_text(errors="replace").splitlines()
                      else:
                          p = subprocess.run(["sudo", "cat", str(f)], capture_output=True, text=True)
                          if p.returncode != 0:
                              continue
                          chunk = p.stdout.splitlines()
                  except OSError:
                      continue
                  lines.append(f"--- {f} ---")
                  lines.extend(chunk[-limit:])
              return "\n".join(lines[-limit * 4:])

          def page_hashes(root: Path, nonce: bytes):
              files = sorted(root.glob("pages-*.img"))
              if not files:
                  raise RuntimeError(f"no pages-*.img in {root}")
              full = hashlib.sha256()
              masked = None
              for f in files:
                  data = f.read_bytes()
                  full.update(f.name.encode() + b"\0")
                  full.update(data)
                  start = 0
                  while True:
                      i = data.find(nonce, start)
                      if i < 0:
                          break
                      if i % 4096 == 8:
                          chunk = bytearray(data[i - 8 : i - 8 + 4096])
                          if len(chunk) == 4096 and chunk[16:] == b"\x00" * (4096 - 16):
                              chunk[0:8] = b"\x00" * 8
                              masked = hashlib.sha256(chunk).hexdigest()
                      start = i + 1
              if masked is None:
                  raise RuntimeError(f"nonce {nonce.hex()} not found on a state page in {root}")
              return full.hexdigest(), masked

          ok = False
          err = None
          restored_id = f"restored-{turn:02d}"
          try:
              cid = run(["docker", "inspect", "-f", "{{.Id}}", "egym-target"]).stdout.strip()
              runc_root, info = locate(cid)
              bundle = info["bundle"]
              live = int(Path("/tmp/target.pid").read_text().strip())

              nonce, counter_before = snapshot(live)
              before = proc_stats(live)
              result["nonce"] = nonce.hex()
              result["counter_before"] = counter_before
              result["before"] = before

              images = ckpt / "images"
              images.mkdir(exist_ok=True)
              work = ckpt / "work"
              work.mkdir(exist_ok=True)
              run([
                  "sudo", "runc", "--root", runc_root, "checkpoint",
                  "--image-path", str(images),
                  "--work-path", str(work),
                  "--leave-running",
                  "--ext-unix-sk",
                  "--shell-job",
                  "--manage-cgroups-mode", "ignore",
                  cid,
              ])
              chown(ckpt)
              if not (images / "inventory.img").exists():
                  raise RuntimeError("checkpoint wrote no inventory.img")

              pages_sha, masked = page_hashes(images, nonce)
              result["pages_sha256"] = pages_sha
              result["state_page_masked_sha256"] = masked

              run(["sudo", "mkdir", "-p", "/tmp/runc-restore"])
              run(["sudo", "runc", "--root", "/tmp/runc-restore", "delete", "-f", restored_id], check=False)
              work_r = ckpt / "work-restore"
              work_r.mkdir(exist_ok=True)
              pidfile = ckpt / "restored.pid"
              run([
                  "sudo", "runc", "--root", "/tmp/runc-restore", "restore",
                  "--bundle", bundle,
                  "--image-path", str(images),
                  "--work-path", str(work_r),
                  "--detach",
                  "--pid-file", str(pidfile),
                  "--ext-unix-sk",
                  "--shell-job",
                  "--manage-cgroups-mode", "ignore",
                  restored_id,
              ])
              chown(ckpt)
              restored_pid = int(pidfile.read_text().strip())
              nonce2, counter_after = snapshot(restored_pid)
              after_stats = proc_stats(restored_pid)
              result["counter_after"] = counter_after
              result["after"] = after_stats
              if nonce2 != nonce:
                  raise RuntimeError(
                      f"nonce mismatch dumped={nonce.hex()} restored={nonce2.hex()}"
                  )
              if counter_after < counter_before:
                  raise RuntimeError(
                      f"counter went backwards {counter_before} -> {counter_after}"
                  )

              after.mkdir(exist_ok=True)
              work_a = ckpt / "work-after"
              work_a.mkdir(exist_ok=True)
              run([
                  "sudo", "runc", "--root", "/tmp/runc-restore", "checkpoint",
                  "--image-path", str(after),
                  "--work-path", str(work_a),
                  "--leave-running",
                  "--ext-unix-sk",
                  "--shell-job",
                  "--manage-cgroups-mode", "ignore",
                  restored_id,
              ])
              chown(ckpt)
              pages_sha2, masked2 = page_hashes(after, nonce)
              result["pages_sha256_after"] = pages_sha2
              result["state_page_masked_sha256_after"] = masked2
              result["pages_differ"] = pages_sha != pages_sha2
              if masked2 != masked:
                  raise RuntimeError(
                      "state page mismatch\n"
                      f"  dump   {masked}\n"
                      f"  restore {masked2}"
                  )
              ok = True
          except Exception as e:
              err = str(e)
              extra = log_tail(ckpt)
              if extra:
                  err = err + "\n" + extra
              result["error"] = err[-8000:]
          finally:
              run(["sudo", "runc", "--root", "/tmp/runc-restore", "delete", "-f", restored_id], check=False)
              result["checkpoint_ok"] = ok
              (ckpt / "result.json").write_text(json.dumps(result, indent=2))
              print(json.dumps(result, indent=2))
              if err:
                  print(err, flush=True)
          raise SystemExit(0 if ok else 1)
          EOF

          cat > "${{ env.WORKDIR }}/scripts/criu_checkpoint.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          TURN=$1
          export TURN
          python3 "${WORKDIR}/scripts/checkpoint_turn.py" "$TURN"
          EOF

          cat > "${{ env.WORKDIR }}/scripts/read_invariant.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          PID=$(cat /tmp/target.pid)
          sudo kill -USR1 "$PID"
          sleep 0.35
          sudo nsenter -t "$PID" -m cat /tmp/probe_state | xxd -p | tr -d '\n'
          echo
          EOF

          chmod +x "${{ env.WORKDIR }}/scripts/"*.sh "${{ env.WORKDIR }}/scripts/checkpoint_turn.py"

      - name: 10-turn agent + per-turn CRIU
        env:
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          AIHUBMIX_BASE_URL: ${{ env.AIHUBMIX_BASE_URL }}
          AIHUBMIX_MODEL: ${{ env.AIHUBMIX_MODEL }}
          MAX_TURNS: ${{ github.event.inputs.max_turns }}
          WORKDIR: ${{ env.WORKDIR }}
          CKPT_ROOT: ${{ env.CKPT_ROOT }}
          LOG_ROOT: ${{ env.LOG_ROOT }}
        run: |
          set -euo pipefail
          source "${{ env.WORKDIR }}/venv/bin/activate"
          bash "${{ env.WORKDIR }}/scripts/start_target.sh"

          python3 - << 'PY'
          import hashlib, os, json, time, subprocess
          from pathlib import Path
          from openai import OpenAI

          client = OpenAI(
              api_key=os.environ["AIHUBMIX_API_KEY"],
              base_url=os.environ["AIHUBMIX_BASE_URL"],
          )
          MODEL = os.environ["AIHUBMIX_MODEL"]
          MAX_TURNS = int(os.environ["MAX_TURNS"])
          WORKDIR = os.environ["WORKDIR"]
          LOG_ROOT = os.environ["LOG_ROOT"]
          CKPT_ROOT = Path(os.environ["CKPT_ROOT"])
          API_ROOT = Path(LOG_ROOT) / "api"
          API_ROOT.mkdir(parents=True, exist_ok=True)

          def log(msg):
              line = time.strftime("%Y-%m-%d %H:%M:%S ") + msg
              print(line, flush=True)
              open(f"{LOG_ROOT}/agent.log", "a").write(line + "\n")

          def canon(obj):
              return json.dumps(obj, sort_keys=True, separators=(",", ":"), default=str).encode()

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def criu(turn):
              r = subprocess.run(
                  ["bash", f"{WORKDIR}/scripts/criu_checkpoint.sh", str(turn)],
                  capture_output=True, text=True)
              log(r.stdout)
              if r.returncode != 0:
                  log("CRIU FAIL: " + r.stderr)
              extra = {}
              p = CKPT_ROOT / f"turn-{turn:02d}" / "result.json"
              if p.exists():
                  extra = json.loads(p.read_text())
              ok = bool(extra.get("checkpoint_ok")) and r.returncode == 0
              return ok, extra

          def invariant():
              r = subprocess.run(
                  ["bash", f"{WORKDIR}/scripts/read_invariant.sh"],
                  capture_output=True, text=True)
              return (r.stdout or r.stderr).strip()

          history = [
              {"role": "system", "content": "You are a short-horizon agent. After every reply the target process is checkpointed with CRIU. Reply briefly each turn."},
              {"role": "user", "content": "Start. The target is live and will be checkpointed after each turn."},
          ]
          summary = []
          trajectory = []
          running = hashlib.sha256()

          for turn in range(1, MAX_TURNS + 1):
              log(f"===== TURN {turn}/{MAX_TURNS} =====")
              request = {
                  "model": MODEL,
                  "temperature": 0.2,
                  "max_tokens": 200,
                  "messages": history,
              }
              req_bytes = canon(request)
              req_hash = sha256(req_bytes)
              (API_ROOT / f"turn-{turn:02d}-request.json").write_bytes(req_bytes + b"\n")

              response = None
              try:
                  resp = client.chat.completions.create(
                      model=MODEL,
                      messages=history,
                      temperature=0.2,
                      max_tokens=200,
                  )
                  response = resp.model_dump() if hasattr(resp, "model_dump") else json.loads(resp.model_dump_json())
              except Exception as e:
                  log(f"LLM error: {e}")
                  response = {"error": str(e)}
                  resp_bytes = canon(response)
                  resp_hash = sha256(resp_bytes)
                  (API_ROOT / f"turn-{turn:02d}-response.json").write_bytes(resp_bytes + b"\n")
                  running.update(req_hash.encode())
                  running.update(resp_hash.encode())
                  row = {
                      "turn": turn,
                      "status": "llm_error",
                      "error": str(e),
                      "request_sha256": req_hash,
                      "response_sha256": resp_hash,
                      "trajectory_sha256": running.hexdigest(),
                  }
                  summary.append(row)
                  trajectory.append(row)
                  break

              resp_bytes = canon(response)
              resp_hash = sha256(resp_bytes)
              (API_ROOT / f"turn-{turn:02d}-response.json").write_bytes(resp_bytes + b"\n")

              msg = (response.get("choices") or [{}])[0].get("message") or {}
              text = (msg.get("content") or "").strip()
              history.append({"role": "assistant", "content": text})
              history.append({"role": "user", "content": f"Turn {turn} complete. Continue."})
              log(f"Model: {text[:240]}")

              ok, extra = criu(turn)
              inv = invariant()
              running.update(req_hash.encode())
              running.update(resp_hash.encode())
              running.update((extra.get("pages_sha256") or "").encode())
              running.update((extra.get("state_page_masked_sha256") or "").encode())
              running.update((extra.get("state_page_masked_sha256_after") or "").encode())
              row = {"turn": turn, "invariant": inv}
              row.update(extra)
              row["checkpoint_ok"] = ok
              row["request_sha256"] = req_hash
              row["response_sha256"] = resp_hash
              row["trajectory_sha256"] = running.hexdigest()
              summary.append(row)
              trajectory.append({
                  "turn": turn,
                  "checkpoint_ok": ok,
                  "request_sha256": req_hash,
                  "response_sha256": resp_hash,
                  "pages_sha256": extra.get("pages_sha256"),
                  "state_page_masked_sha256": extra.get("state_page_masked_sha256"),
                  "state_page_masked_sha256_after": extra.get("state_page_masked_sha256_after"),
                  "trajectory_sha256": row["trajectory_sha256"],
              })
              log(
                  "ok=%s nonce=%s counter=%s->%s pages=%s masked=%s req=%s resp=%s"
                  % (
                      ok,
                      row.get("nonce"),
                      row.get("counter_before"),
                      row.get("counter_after"),
                      (row.get("pages_sha256") or "")[:12],
                      (row.get("state_page_masked_sha256") or "")[:12],
                      req_hash[:12],
                      resp_hash[:12],
                  )
              )
              time.sleep(1.5)

          traj = {
              "turns": trajectory,
              "final_trajectory_sha256": running.hexdigest(),
          }
          open(f"{LOG_ROOT}/trajectory.json", "w").write(json.dumps(traj, indent=2))
          open(f"{LOG_ROOT}/summary.json", "w").write(json.dumps(summary, indent=2))
          log("trajectory " + running.hexdigest())
          log("Done")
          if not summary or not all(s.get("checkpoint_ok") for s in summary):
              raise SystemExit(1)
          PY

      - name: Upload checkpoints + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criu-10turn-${{ github.run_id }}
          path: |
            ${{ env.CKPT_ROOT }}
            ${{ env.LOG_ROOT }}
          retention-days: 14

      - name: Publish trajectory release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! -f "${{ env.LOG_ROOT }}/summary.json" ]]; then
            echo "No trajectory to release"
            exit 0
          fi
          ARCHIVE="${{ github.workspace }}/trajectory-${{ github.run_id }}.tar.gz"
          tar -C "${{ env.WORKDIR }}" -czf "$ARCHIVE" checkpoints logs
          sha256sum "$ARCHIVE" | tee "${{ env.LOG_ROOT }}/archive.sha256"
          NOTES="${{ env.LOG_ROOT }}/release-notes.md"
          {
            echo "# Trajectory ${{ github.run_id }}"
            echo
            echo "First 10 turns. Each turn stores the API request, the API response, the CRIU images, and the hashes below."
            echo
            echo '```json'
            cat "${{ env.LOG_ROOT }}/trajectory.json" 2>/dev/null || echo "{}"
            echo '```'
            echo
            echo "Archive sha256:"
            echo
            echo '```'
            cat "${{ env.LOG_ROOT }}/archive.sha256"
            echo '```'
          } > "$NOTES"
          gh release create "trajectory-${{ github.run_id }}" \
            "$ARCHIVE" \
            --repo "${{ github.repository }}" \
            --title "Trajectory ${{ github.run_id }}" \
            --notes-file "$NOTES" \
            --target "${{ github.sha }}"

      - name: Summary
        if: always()
        run: |
          echo "===== SUMMARY ====="
          cat "${{ env.LOG_ROOT }}/summary.json" 2>/dev/null || true
          ls -la "${{ env.CKPT_ROOT }}" || true
